[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "irus"
version = "0.1.0"
description = "Catches the bug that happens between two AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Deliberately empty. The engine and the coordination server are standard
# library only, so `irus check` works with no install step, no network and no
# build. The optional extras below are needed by two specific paths and by
# nothing else.
dependencies = []

[project.optional-dependencies]
# Richer parsing of docker-compose and GitHub Actions env blocks. envvars.py
# falls back to a regex scan when PyYAML is absent.
config = ["PyYAML>=6.0"]
# Stage-2 execution proof drives an ASGI app through Starlette's test client.
prove = ["starlette>=0.37", "httpx>=0.27"]
dev = ["pytest>=8"]

[project.scripts]
irus = "irus.cli:main"
# A client registers an MCP server by command name, not by `python -m ...` with
# a PYTHONPATH. Without its own entry point the server is only launchable from
# a checkout, which is the opposite of working anywhere.
irus-mcp = "irus.mcp_server:cli"

[tool.setuptools]
packages = ["irus", "irus.extract"]

[tool.setuptools.package-data]
irus = ["page.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
