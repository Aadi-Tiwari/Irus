# Render Blueprint for the Irus coordination server.
#
# The engine is stdlib-only, so there is nothing to install and the build step
# is a no-op. The same server binary runs offline on a laptop; hosting it here
# only changes where the shared room lives.
#
# IRUS_TOKEN is generated by Render and never committed. Every write to
# /ingest must present it as `Authorization: Bearer <token>`.

services:
  - name: irus
    type: web
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m irus.web
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.3"
      - key: IRUS_TOKEN
        generateValue: true
      - key: IRUS_DATA_DIR
        value: /var/irus/rooms
    disk:
      name: irus-rooms
      mountPath: /var/irus
      sizeGB: 1
