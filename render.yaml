# Render Blueprint for Irus: the coordination server and the landing site.
#
# The engine is stdlib-only, so there is nothing to install and the build step
# is a no-op. The same server binary runs offline on a laptop; hosting it here
# only changes where the shared room lives.
#
# IRUS_TOKEN is generated by Render and never committed. Every write to
# /ingest must present it as `Authorization: Bearer <token>`.
#
# The site under web/ prerenders every route, so it ships as static files on a
# CDN rather than as a Node process. There is no server to keep warm and nothing
# to cold-start.

services:
  - name: irus
    type: web
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m irus.web
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.3"
      - key: IRUS_TOKEN
        generateValue: true
      - key: IRUS_DATA_DIR
        value: /var/irus/rooms
    disk:
      name: irus-rooms
      mountPath: /var/irus
      sizeGB: 1

  # The landing site. `next build` with output: "export" writes plain HTML, JS
  # and assets to web/out, so this is a static site rather than a web service.
  # rootDir is web/, and every path below is relative to it.
  - name: irus-web
    type: web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22.17.0"
    headers:
      # Next fingerprints everything under _next/static, so those files can be
      # cached forever. The HTML must not be, or a deploy would not be visible.
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.mp4
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
