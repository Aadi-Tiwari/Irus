# Publishes the landing site under web/ to GitHub Pages.
#
# Pages serves a project site from /<repo>, so the build is told its prefix via
# BASE_PATH. Jekyll is what would otherwise serve this: it silently drops every
# directory beginning with an underscore, which is all of Next's _next/ output,
# so .nojekyll is not optional.

name: Deploy landing site to Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A queued run is allowed to finish rather than being
# cancelled, so a push never leaves the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # Emits base_path for this Pages site, so the prefix is read from GitHub
      # rather than hard-coded to a repo name that could be renamed.
      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
